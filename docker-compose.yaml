services:
  user-service:
    build: ./user-service
    env_file:
      - ./user-service/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  tasks-service:
    build: ./tasks-service
    env_file:
      - ./tasks-service/.env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: k8s_demo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

volumes:
  pgdata: