apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasks-service
  template:
    metadata:
      labels:
        app: tasks-service
    spec:
      containers:
        - name: tasks-service
          image: tasks-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: tasks-service-config
            - secretRef:
                name: tasks-service-secret
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-service
spec:
  type: ClusterIP
  selector:
    app: tasks-service
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tasks-service-config
data:
  PORT: "3001"