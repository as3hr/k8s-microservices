apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasks-service
  template:
    metadata:
      labels:
        app: tasks-service
    spec:
      containers:
        - name: tasks-service
          image: tasks-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: postgres://postgres:postgres@postgres:5432/k8s_demo
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-service
spec:
  type: ClusterIP
  selector:
    app: tasks-service
  ports:
    - port: 3001
      targetPort: 3001